// NDK Version: v0.5.0

syntax = "proto3";

package srlinux.sdk;

import "ndk/sdk_common.proto";

option go_package = "github.com/nokia/srlinux-ndk-go/ndk";

/**
 * Represents LLDP neighbor subscription request.
 */
message LldpNeighborSubscriptionRequest {
  LldpNeighborKey key = 1; // Optional, to filter on name
}

/**
 * Represents LLDP neighbor key.
 */
message LldpNeighborKey {
  // Represents chassis type.
  enum ChassisIdType {
    CHASSIS_ID_TYPE_RESERVED = 0; // Reserved for future use
    CHASSIS_ID_TYPE_CHASSIS_COMPONENT = 1; // Chassis identifier based on a locally defined chassis component
    CHASSIS_ID_TYPE_INTERFACE_ALIAS = 2; // Alias of the interface
    CHASSIS_ID_TYPE_PORT_COMPONENT = 3; // Chassis identifier based on a locally defined port component
    CHASSIS_ID_TYPE_MAC_ADDRESS = 4; // MAC address
    CHASSIS_ID_TYPE_NETWORK_ADDRESS = 5; // Network address
    CHASSIS_ID_TYPE_INTERFACE_NAME = 6; // Name of the interface
    CHASSIS_ID_TYPE_LOCALLY_ASSIGNED = 7; // Chassis identifier based on a locally defined value
  }

  string interface_name = 1; // Local interface name
  string chassis_id = 2; // Chassis identifier
  ChassisIdType chassis_type = 3; // Chassis type
}

/**
 * Represents LLDP neighbor data.
 */
message LldpNeighborData {
  // Represents port subtype.
  enum PortSubType {
    PORT_SUB_TYPE_RESERVED = 0; // Reserved for future use
    PORT_SUB_TYPE_INTERFACE_ALIAS = 1; // Alias of the interface
    PORT_SUB_TYPE_PORT_COMPONENT = 2; // Port identifier based on a locally defined port component
    PORT_SUB_TYPE_MAC_ADDRESS = 3; // MAC address
    PORT_SUB_TYPE_NETWORK_ADDRESS = 4; // Network address
    PORT_SUB_TYPE_INTERFACE_NAME = 5; // Name of the interface
    PORT_SUB_TYPE_AGENT_CIRCUIT_ID = 6; // Port identifier based on the circuit ID in the DHCP relay agent information option
    PORT_SUB_TYPE_LOCALLY_ASSIGNED = 7; // Port identifier based on a locally defined alphanumeric string
  }

  string port_id = 1; // Port identifier
  PortSubType port_type = 2; // Port type
  MacAddressPb source_mac = 3; // Port MAC address
  repeated IpAddressPb bgp_peer_addresses = 4; // LLDP BGP autodiscovered addresses
  uint32 bgp_group_id = 5; // BGP group identifier
  string system_name = 6; // System name
  string system_description = 7; // System description
}

/**
 * Represents LLDP neighbor notification.
 */
message LldpNeighborNotification {
  SdkMgrOperation op = 1; // Operation such as create, delete, or update
  LldpNeighborKey key = 2; // LLDP neighbor key
  LldpNeighborData data = 3; // LLDP neighbor data
}
